spring:
  datasource:
    url: jdbc:h2:mem:dermaday;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            provider: kakao
            client-id: test-kakao-client
            client-secret: test-kakao-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
          naver:
            provider: naver
            client-id: test-naver-client
            client-secret: test-naver-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  frontend-base-url: https://dermaday.me
  backend-base-url: http://localhost:8080
  cors:
    allowed-origins:
      - http://localhost:5173
  jwt:
    secret: test-jwt-secret-that-is-at-least-32-bytes-long
    access-token-ttl: PT24H
  auth-cookie:
    name: DERMADAY_ACCESS_TOKEN
    secure: false
    same-site: Lax
